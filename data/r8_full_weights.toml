# ============================================================
# 完整策略权重（76 基因全展开）——拿走即可复现，无需另查 preset
# ============================================================
# 个体: R8 冠军（r8 #65 赤心的驯鹿小姐 目白善信 uma_id=106402）
# 实测: GA fitness=71415.6（精评 60 局 seed=42 均值）| holdout=71328.9（seed=43）
# 配卡: 见 reports 仓 data/r8_champion_cards.json（速2耐1智2 五张 SSR, indices=[0,2,47,4,2]）
#
# 【评估种子】
#   GA 精评 60 局: base_seed=42    GA holdout 40 局: holdout_seed=43
#   bench_base 单局重放: --seed 1001（确定性, 逐位可复现）
# 【评估协议】
#   fitness = λ_race=800, 精评 60 局(seed42)均值; 初筛 3build×20局; holdout 40局(seed43)
# 【环境】
#   剧本: 小仓拉面(ramen, 评估器内置) | 友人卡: 303054
#   继承因子: blue_count=[15,0,0,0,3] extra_count=[10,10,20,20,20,40]
#   评估器版本: R8 当年=7c983a0, 单局重放锚=8e9f7a5, 当前 master 定标实验进行中
# 【复现命令】(工作目录=umaai-rs 仓根, gamedata/umaDB.json 用 lab 仓 data/ 版)
#   cargo build --release --bin bench_base
#   ./target/release/bench_base --uma <马娘id> --trainer handwritten --genome-file <本文件> --log --runs 1 --seed 1001
#   (R8 冠军 --uma 106402; 当年 7 卡组锚: speed_wisdom=69642 / spd2_gut0=69190 / stamina=67129 / speed=66884 / sta0_wis2=62836 / wisdom=62025 / power_wisdom=56002)
