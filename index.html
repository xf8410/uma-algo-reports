<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>赛马娘算法实验室 · 报告站</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --line:#e5e8ee; --txt:#24292f; --sub:#6a737d;
  --acc:#1a7f5c; --acc-soft:#e6f4ee; --warn:#b35900; --warn-soft:#fff3e0;
  --sel:#0b6bcb; --sel-soft:#eaf3fd; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:1080px;margin:0 auto;padding:14px 12px 70px}
header{padding:14px 0 6px}
header h1{margin:0;font-size:20px}
header p{margin:3px 0 0;color:var(--sub);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;position:sticky;top:0;
  background:var(--bg);padding:8px 0;z-index:9;border-bottom:1px solid var(--line)}
.bar select,.bar input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff}
.bar input{flex:1;min-width:140px}
.bar .cnt{color:var(--sub);font-size:13px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(20,30,40,.04)}
.card h2{margin:0 0 8px;font-size:17px}
.card h3{margin:12px 0 6px;font-size:15px}
.muted{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px;white-space:nowrap}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.score{font-weight:700;color:var(--acc)}
.rank{display:inline-block;background:var(--acc-soft);color:var(--acc);border-radius:6px;
  padding:1px 8px;font-size:12px;font-weight:600}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;margin-left:6px}
.tag.drift{background:var(--warn-soft);color:var(--warn)}
.tag.same{background:#eef1f4;color:var(--sub)}
.cand{color:var(--sub);font-size:12.5px;word-break:break-all}
.cand .best{color:var(--sel);font-weight:700}
ul.plain{margin:6px 0;padding-left:18px}
.five{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.five span{background:#f0f3f6;border-radius:6px;padding:2px 9px;font-size:13px}
.kv{font-size:13.5px;color:var(--sub);margin:3px 0}
.kv b{color:var(--txt)}
.buy-tbl td{padding:5px 9px}
/* 逐回合块 */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:24px 0 6px;flex-wrap:wrap}
.sec-title h2{margin:0;font-size:18px}
.turn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:7px 0}
.turn .th{font-size:13.5px;color:var(--sub);margin-bottom:4px}
.turn .th b{color:var(--txt);font-size:14px}
.turn .tc{padding:1px 0}
.turn .tc.best{color:var(--sel);font-weight:600}
.turn .tc.none{color:var(--sub);font-style:italic}
.totop{position:fixed;right:16px;bottom:20px;width:42px;height:42px;border-radius:50%;
  background:var(--acc);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:99}
.err{background:#fdecec;color:#a33;border-radius:10px;padding:14px;margin:14px 0;font-size:14px}
.spin{margin:60px auto;text-align:center;color:var(--sub)}
footer{color:var(--sub);font-size:12px;margin-top:30px;text-align:center}
@media (max-width:600px){ th,td{padding:6px 7px} header h1{font-size:18px} .card{padding:12px} }
@media print{ .bar,.totop{display:none} body{background:#fff} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏁 赛马娘算法实验室 · 报告站</h1>
    <p>打开即看全部明细（每回合全部候选与打分）· 数据随仓库自动更新</p>
  </header>
  <div class="bar">
    <select id="reportSel"></select>
    <select id="stageSel"><option value="all">全部阶段</option></select>
    <input id="q" placeholder="筛选（可选）：技能 / 外出 / 比赛 …">
    <span class="cnt" id="cnt"></span>
  </div>
  <div id="app"><div class="spin">加载中…</div></div>
  <button class="totop" id="totop" title="回到顶部" style="display:none">↑</button>
  <footer>xf8410/uma-algo-reports · 风起自动推送数据，网页自动更新</footer>
</div>
<script src="data/data.js"></script>
<script>
"use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function appEl(){return document.getElementById("app")}
function fatal(msg){
  appEl().innerHTML='<div class="err">⚠️ '+esc(msg)+' <button class="btn small" onclick="location.reload()">重试</button></div>';
}
function renderCand(item,isBest){
  var m=/^#(\d+)\s+(\S+)\[(.*)\]$/.exec(String(item).trim());
  var inner=m?("#"+m[1]+" "+m[2]+"["+esc(m[3])+"]"):esc(item);
  return "<div class='tc "+(isBest?"best":"")+"'>"+(isBest?"✅ ":"&nbsp;&nbsp;")+"<span class='"+(isBest?"best":"")+"'>"+inner+"</span></div>";
}
var CUR=null;

function init(){
  if(typeof window.REPORT_DATA==="undefined"){fatal("数据未加载成功，请点重试");return}
  var reps=window.REPORT_DATA.reports;
  var sel=document.getElementById("reportSel");
  sel.innerHTML=reps.map(function(r){return "<option value='"+esc(r.meta.id)+"'>"+esc(r.meta.date+" · "+r.meta.title)+"</option>"}).join("");
  sel.onchange=function(){paint(sel.value)};
  var want=(location.hash.match(/^#\/report\/(.+)$/)||[])[1];
  var first=want&&reps.some(function(r){return r.meta.id===want})?want:reps[0].meta.id;
  sel.value=first;
  paint(first);
}

function paint(id){
  var rep=window.REPORT_DATA.reports.filter(function(r){return r.meta.id===id})[0];
  if(!rep){fatal("找不到报告 "+id);return}
  CUR=rep;
  var m=rep.meta,turns=rep.turns;
  var byScore=m.builds.slice().sort(function(a,b){return b.score-a.score});

  /* 总成绩排名（高分→低分） */
  var rankRows=byScore.map(function(b,i){
    var f=b.five||{};
    return "<tr><td>"+(i+1)+"</td><td><b>"+esc(b.name)+"</b></td><td class='score'>"+b.score+"</td><td><span class='rank'>"+esc(b.rank)+"</span></td><td>"+b.old_score+"</td><td class='muted'>速"+f.speed+" 耐"+f.stamina+" 力"+f.power+" 根"+f.guts+" 智"+f.wisdom+"</td></tr>";
  }).join("");

  /* 评分分解与买技能卡（高分→低分） */
  var cards=byScore.map(function(b){
    var f=b.five||{};
    var buys=(b.buys||[]).map(function(x){return "<tr><td>"+esc(x.name)+"</td><td>"+x.price+"</td><td>"+x.grade+"</td><td>"+x.gain+"</td></tr>"}).join("");
    return "<div class='card'><h3>["+b.num+"] <b>"+esc(b.name)+"</b> — 总分 <span class='score'>"+b.score+"</span> <span class='rank'>"+esc(b.rank)+"</span>"+
      "<span class='tag "+(b.drift==="漂移"?"drift":"same")+"'>"+(b.drift==="漂移"?"轨迹有漂移":"轨迹一致")+"</span></h3>"+
      "<div class='five'><span>速 "+f.speed+"</span><span>耐 "+f.stamina+"</span><span>力 "+f.power+"</span><span>根 "+f.guts+"</span><span>智 "+f.wisdom+"</span></div>"+
      "<div class='kv'>评分分解：<b>"+esc(b.decompose)+"</b></div>"+
      "<div class='kv'>Pt 账目：<b>"+esc(b.pt_account)+"</b></div>"+
      (buys?"<div class='kv'>终局买入技能：</div><div class='tblwrap'><table class='buy-tbl'><tr><th>技能</th><th>价格</th><th>Grade</th><th>净增分</th></tr>"+buys+"</table></div>":"<div class='kv'>终局未买入技能</div>")+
      "</div>";
  }).join("");

  /* 阶段下拉 */
  var stages=[];
  byScore.forEach(function(b){(turns[b.name]||{turns:[]}).turns.forEach(function(t){if(stages.indexOf(t.stage)<0)stages.push(t.stage)})});
  var stageSel=document.getElementById("stageSel");
  var curSt=stageSel.value||"all";
  stageSel.innerHTML="<option value='all'>全部阶段</option>"+stages.map(function(s){return "<option value='"+esc(s)+"'>"+esc(t2cn(s))+"</option>"}).join("");
  stageSel.value=(curSt==="all"||stages.indexOf(curSt)>=0)?curSt:"all";

  /* 逐回合全量平铺：每回合直接列出全部候选打分 */
  var totalTurns=0;
  var sections=byScore.map(function(b){
    var t=turns[b.name];if(!t)return"";
    totalTurns+=t.total;
    var blocks=t.turns.map(function(x){
      var c=x.candidates;
      var body=c.length?c.map(function(cc,i){return renderCand(cc,i===x.action_index)}).join(""):
        "<div class='tc none'>（事件类选择，无择优打分）AI 决定："+esc(x.action_desc)+"</div>";
      return "<div class='turn' data-stage='"+esc(x.stage)+"' data-hay='"+esc((x.stage_cn+" "+x.action_desc+" "+c.join(" ")).toLowerCase())+"'>"+
        "<div class='th'>回合 "+x.turn+" · "+esc(x.stage_cn)+" → <b>"+esc(x.action_desc)+"</b></div>"+body+"</div>";
    }).join("");
    return "<div class='sec-title'><h2>"+esc(b.name)+"</h2><span class='muted'>第 "+(byScore.indexOf(b)+1)+" 名 · "+b.score+" 分 · 全部 "+t.total+" 回合明细如下</span></div>"+blocks;
  }).join("");

  appEl().innerHTML=
    "<div class='card'><h2>"+esc(m.title)+"</h2><div class='muted'>"+esc(m.date)+" · 7 卡组新口径均分 <b class='score'>"+m.mean+"</b> · 排名从高分到低分</div>"+
    "<p>"+esc(m.summary)+"</p>"+
    "<div class='tblwrap'><table><thead><tr><th>排名</th><th>卡组</th><th>新口径总分</th><th>评价</th><th>旧口径对照</th><th>五维</th></tr></thead><tbody>"+rankRows+"</tbody></table></div></div>"+
    "<div class='card'><h2>跑法与口径</h2>"+
    "<div class='kv'>代码：<b>"+esc(m.method.code)+"</b></div>"+
    "<div class='kv'>命令：<b>"+esc(m.method.run)+"</b></div>"+
    "<ul class='plain'>"+m.method.formula.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul>"+
    "<div class='muted'>每个回合直接列出 AI 考虑过的全部选项和打分（绿色 ✅ 是最终选择；分数=AI 给该选项的评分，越高越好）。</div></div>"+
    "<div class='sec-title'><h2>评分分解与终局买技能</h2><span class='muted'>按总分从高到低</span></div>"+cards+
    "<div class='sec-title'><h2>逐回合育成明细（全量铺开）</h2><span class='muted'>共 "+totalTurns+" 个回合 · 每回合含全部候选打分</span></div>"+sections;

  document.getElementById("stageSel").onchange=applyFilter;
  document.getElementById("q").oninput=applyFilter;
  document.getElementById("totop").style.display="block";
  applyFilter();
}

function t2cn(s){return({Train:"训练",Event:"事件",RamenSelect:"吃面选择",RegionSelect:"地区选择",SpecialSelect:"特殊选择",SuperRamenSelect:"高级吃面选择",Race:"比赛",Rest:"休息",Outing:"外出"})[s]||s}

function applyFilter(){
  if(!CUR)return;
  var st=document.getElementById("stageSel").value;
  var q=document.getElementById("q").value.trim().toLowerCase();
  var show=0,total=0;
  document.querySelectorAll("#app .turn").forEach(function(d){
    total++;
    var okStage=st==="all"||d.getAttribute("data-stage")===st;
    var okQ=!q||d.getAttribute("data-hay").indexOf(q)>=0;
    var vis=okStage&&okQ;
    d.style.display=vis?"":"none";
    if(vis)show++;
  });
  document.getElementById("cnt").textContent="显示 "+show+" / "+total+" 回合";
}

document.getElementById("totop").onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
init();
</script>
</body>
</html>
